spring.application.name=mrs-sbo-suma-sunat-params

# MySQL Database Configuration
# DataSource para datos de negocio (MySQL) - padron_sunat
# La base de datos 'bdsupra' se agrega por código en DataSourceConfig
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:useradcomp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:useradcomp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate Performance Optimization - Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Server Configuration
server.port=8080

# Do not include exception messages in default error responses (avoid leaking JDBC messages)
server.error.include-message=never

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
