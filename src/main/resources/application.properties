spring.application.name=mrs-sbo-suma-sunat-params

# MySQL Database Configuration
# DataSource para datos de negocio (MySQL) - padron_sunat, cambio_sunat
# La base de datos 'bdsupra' se agrega por código en DataSourceConfig
# Mismas variables que usa suma: ADCOMP_DB_HOST / ADCOMP_DB_USER / ADCOMP_DB_PASS
spring.datasource.url=${ADCOMP_DB_HOST:jdbc:mysql://localhost:3307/}
spring.datasource.username=${ADCOMP_DB_USER:useradcomp}
spring.datasource.password=${ADCOMP_DB_PASS:jknCIxMC1fYujCo18DBo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate Performance Optimization - Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Server Configuration
server.port=${ADCOMP_APP_PORT:8082}

# Do not include exception messages in default error responses (avoid leaking JDBC messages)
server.error.include-message=never

# OAuth2 Resource Server - JWT validation via internal Auth Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ADCOMP_AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks

# Internal Auth Server connection (for JTI validation)
app.auth-server.url=${ADCOMP_AUTH_SERVER_URL:http://localhost:9000}
app.auth-server.internal-secret=${ADCOMP_APP_INTERNAL_SECRET:adcomp-internal-2026}
app.auth-server.jti-validation.enabled=${ADCOMP_JTI_VALIDATION_ENABLED:true}
app.auth-server.jti-validation.cooldown-seconds=${ADCOMP_JTI_COOLDOWN_SECONDS:60}

# CORS - origenes permitidos (sobreescribir con ADCOMP_CORS_ORIGINS en produccion)
app.cors.allowed-origins=${ADCOMP_CORS_ORIGINS:http://localhost:4200,https://dev.adcomp.work,https://int.adcomp.work,https://cal.adcomp.work,https://suma.work,https://adcomp.work}

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
